<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Private SMS Dashboard"
    >

    <title>SMS Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>


<body>

    <div class="dashboard">

        <!-- ==========================================
             HEADER
        =========================================== -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    SMS
                </div>

                <div class="brand-text">

                    <h1>
                        SMS Dashboard
                    </h1>

                    <p>
                        Manage messages from your devices
                    </p>

                </div>

            </div>


            <div class="connection-status">

                <span
                    id="connectionDot"
                    class="status-dot connected"
                ></span>

                <span id="connectionText">
                    Live
                </span>

            </div>

        </header>


        <!-- ==========================================
             FILTER BAR
        =========================================== -->

        <section class="filter-bar">


            <!-- PHONE -->

            <div class="filter-group phone-group">

                <h2>
                    Phone
                </h2>


                <div
                    id="deviceFilters"
                    class="filter-buttons"
                >

                    <button
                        type="button"
                        class="filter-btn active"
                        data-device="all"
                    >
                        All Phones
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-device="samsung"
                    >
                        Samsung
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-device="poco"
                    >
                        Poco
                    </button>

                </div>

            </div>


            <!-- DIVIDER -->

            <div class="filter-divider"></div>


            <!-- SMS TYPE -->

            <div class="filter-group sms-type-group">

                <h2>
                    SMS Type
                </h2>


                <div
                    id="categoryFilters"
                    class="filter-buttons"
                >

                    <button
                        type="button"
                        class="filter-btn active"
                        data-category="all"
                    >
                        All SMS
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="OTP"
                    >
                        OTP
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="Banking"
                    >
                        Banking
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="Delivery"
                    >
                        Delivery
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="Work"
                    >
                        Work
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="Other"
                    >
                        Other
                    </button>

                </div>

            </div>

        </section>


        <!-- ==========================================
             SEARCH BAR
        =========================================== -->

        <section class="toolbar">

            <div class="search-wrapper">

                <span class="search-icon">
                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        ></circle>

                        <line
                            x1="16.5"
                            y1="16.5"
                            x2="21"
                            y2="21"
                        ></line>
                    </svg>
                </span>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search sender or message..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    aria-label="Clear search"
                >
                    ×
                </button>

            </div>


            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >

                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M21 12a9 9 0 0 1-15.3 6.5"
                    ></path>

                    <path
                        d="M3 12a9 9 0 0 1 15.3-6.5"
                    ></path>

                    <polyline
                        points="21 3 21 9 15 9"
                    ></polyline>

                    <polyline
                        points="3 21 3 15 9 15"
                    ></polyline>
                </svg>

                <span>
                    Refresh
                </span>

            </button>

        </section>


        <!-- ==========================================
             CATEGORY DESCRIPTION
        =========================================== -->

        <div
            id="categoryDescription"
            class="category-description"
        >
            Showing all SMS messages
        </div>


        <!-- ==========================================
             MESSAGES HEADER
        =========================================== -->

        <section class="messages-header">

            <div>

                <h2>
                    Messages
                </h2>

                <span id="visibleCount">
                    0 messages
                </span>

            </div>

        </section>


        <!-- ==========================================
             MESSAGE LIST
        =========================================== -->

        <main
            id="messagesList"
            class="messages-list"
        >

        </main>


        <!-- ==========================================
             EMPTY STATE
        =========================================== -->

        <section
            id="emptyState"
            class="empty-state"
            style="display: none;"
        >

            <div class="empty-icon">
                ✉
            </div>


            <h3>
                No messages found
            </h3>


            <p>
                There are no SMS messages matching
                your current filters.
            </p>

        </section>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="/static/app.js"></script>

</body>

</html>
